<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Golden Sip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap">
<style>
/* Layout: single dark cafe site, three views (home, Instagram QR, owner) switched by hash; sticky header, bottom cart bar and sheet. */
:root{
  --bg:#120f0d; --bg-2:#181310; --surface:#1d1814; --surface-2:#251e18; --input:#14100d;
  --line:#3b2f25; --line-soft:#2a221b;
  --fg:#f7f1e6; --muted:#a79a8a; --dim:#7c7064;
  --gold:#d4a257; --gold-hi:#f0b44c; --gold-ink:#1a1209;
  --veg:#17b97e; --nonveg:#ef3b3b;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutr:max(16px,env(safe-area-inset-right,0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
@media(max-width:900px){html{scroll-padding-top:136px}}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg-2);z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{width:100%;max-width:1160px;margin-inline:auto;padding-left:var(--gut);padding-right:var(--gutr)}
.mono{font-family:var(--mono);letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--gold)}
.ico{width:1.1em;height:1.1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg-2);border-bottom:1px solid var(--line-soft)}
.hdr .wrap{display:flex;align-items:center;gap:20px;min-height:76px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;font:400 26px/1 var(--serif);white-space:nowrap}
.brand em{color:var(--gold);font-style:normal}
.brand svg.logo{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 2px #2b2437,0 0 22px #d4a25733}
.nav{display:flex;gap:30px;margin-left:auto;margin-right:auto}
.nav a{text-decoration:none;color:var(--muted);font-size:17px;display:inline-flex;gap:8px;align-items:center;padding:6px 0}
.nav a:hover,.nav a[aria-current]{color:var(--fg)}
.hdr-r{display:flex;gap:12px;align-items:center}
.call{display:inline-flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 16px;text-decoration:none;white-space:nowrap}
.call .ico{color:var(--gold)}
.cartbtn{position:relative;width:52px;height:52px;border-radius:10px;border:0;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center}
.cartbtn .ico{width:24px;height:24px}
.cartbtn b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--fg);color:var(--gold-ink);font:700 12px/20px var(--sans);text-align:center;padding:0 5px}
@media(max-width:900px){.nav,.call{display:none}.hdr-r{margin-left:auto}.brand{font-size:23px}.brand svg.logo{width:48px;height:48px}}
@media(max-width:380px){.brand span{display:none}}
.mnav{display:none;border-top:1px solid var(--line-soft);overflow-x:auto}
.mnav .wrap{display:flex;gap:22px;min-height:46px;align-items:center;width:max-content;min-width:100%}
.mnav a{text-decoration:none;color:var(--muted);font-size:15px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
@media(max-width:900px){.mnav{display:block}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:14px 22px;font-weight:600;text-decoration:none;font-size:16px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{background:var(--gold-hi)}
.btn:hover{border-color:var(--gold)}
.link{color:var(--gold);text-decoration:none;display:inline-flex;gap:8px;align-items:center;border-bottom:1px solid #d4a25755;padding-bottom:2px}

/* hero */
.hero{padding-block:clamp(56px,9vw,120px) clamp(36px,5vw,64px);background:radial-gradient(900px 400px at 15% 0,#2a1f14 0,transparent 70%),var(--bg-2)}
.hero h1{font:400 clamp(52px,10.5vw,132px)/.98 var(--serif);margin:22px 0 28px;letter-spacing:-.01em;text-wrap:balance}
.hero h1 em,.sec h2 em{color:var(--gold-hi);font-style:italic}
.hero p{max-width:640px;color:var(--muted);font-size:clamp(17px,2vw,21px);margin:0 0 34px}
.eyebrow{display:flex;gap:14px;align-items:center}
.cta{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.live{display:flex;gap:12px;align-items:center;margin-top:44px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--veg);box-shadow:0 0 0 4px #17b97e33;flex:none}
.figure{position:relative;margin:clamp(28px,4vw,56px) 0 0}
.figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.badge{position:absolute;left:clamp(10px,3vw,40px);bottom:clamp(-30px,-3vw,-20px);width:112px;height:112px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;text-align:center;font:500 12px/1.3 var(--mono);border:6px solid var(--bg)}
.badge .ico{display:block;margin:0 auto 4px;fill:currentColor}
.ticker{background:var(--gold);color:var(--gold-ink);overflow:hidden;white-space:nowrap;margin-top:clamp(40px,5vw,60px)}
.ticker div{display:inline-flex;gap:30px;padding:16px 0;font:500 13px var(--mono);letter-spacing:.24em;animation:tick 28s linear infinite}
@keyframes tick{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.ticker div{animation:none}html{scroll-behavior:auto}}

/* sections */
.sec{padding-block:clamp(64px,9vw,120px)}
.sec .tag{display:flex;gap:16px;align-items:center;font:400 12px var(--mono);letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
.sec .tag::after{content:"";width:48px;height:1px;background:var(--line);order:0}
.sec .tag span{order:1}
.sec h2{font:400 clamp(40px,7vw,76px)/1.04 var(--serif);margin:22px 0 22px;text-wrap:balance}
.sec p.lead{color:var(--muted);max-width:560px;font-size:18px;margin:0 0 24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,72px);align-items:center}
.two>*{min-width:0}
@media(max-width:800px){.two{grid-template-columns:1fr}}
.pic{position:relative}
.pic img{display:block;width:100%;border-radius:14px;border:1px solid var(--line);aspect-ratio:5/4;object-fit:cover}
.pic .stat{position:absolute;left:12px;bottom:-26px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 16px;display:flex;gap:10px;align-items:baseline}
.stat b{font:400 40px/1 var(--serif);color:var(--gold-hi)}
.stat small{font:400 11px/1.3 var(--mono);color:var(--muted)}

/* menu */
.loved{margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:800px){.loved{grid-template-columns:1fr}}
.lv{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:18px;min-width:0}
.lv h3{margin:0 0 12px;font:400 22px var(--serif);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lv h3 small{font:400 11px var(--mono);letter-spacing:.18em;color:var(--dim);text-transform:uppercase}
.fm{margin-top:clamp(56px,8vw,96px)}
.search{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;background:var(--input);padding:0 16px;margin:20px 0 16px}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;padding:14px 0;outline:none}
.search .ico{color:var(--dim)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 16px;font-size:15px;color:var(--fg)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:600}
.cat{margin-top:44px}
.cat h3{display:flex;justify-content:space-between;gap:16px;align-items:baseline;margin:0 0 6px;font:400 clamp(30px,4vw,40px) var(--serif);flex-wrap:wrap}
.cat h3 small{font:400 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.sub{display:flex;align-items:center;gap:10px;margin:22px 0 12px;font:500 12px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.vd{width:16px;height:16px;border:1.5px solid var(--veg);border-radius:3px;display:inline-grid;place-items:center;flex:none}
.vd::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--veg)}
.vd.nv{border-color:var(--nonveg)}.vd.nv::after{background:var(--nonveg)}
.list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.list{grid-template-columns:1fr}}
.it{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;min-width:0}
.it.off{opacity:.45}
.it .tx{flex:1 1 150px;min-width:0}
@media(max-width:560px){.it .pr{margin-left:auto}.it .acts{flex:1 1 100%;justify-content:flex-end;margin-top:-4px}.it .pr{order:2}.it .vd{order:0}}
.it .nm{font-weight:500;font-size:17px;line-height:1.25}
.it .sb{font-size:13px;color:var(--dim);margin-top:2px}
.it .pr{font:500 17px var(--mono);color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.add{border:1px solid #17b97e88;background:#17b97e1f;color:#4be0a8;border-radius:6px;padding:8px 12px;font:700 12px var(--mono);letter-spacing:.06em;white-space:nowrap}
.add:hover{background:#17b97e40}
.add:disabled{border-color:var(--line);color:var(--dim);background:none;cursor:not-allowed}
.step{display:inline-flex;align-items:center;border:1px solid #17b97e88;border-radius:6px;overflow:hidden;background:#17b97e1f}
.step button{border:0;background:none;width:32px;height:34px;color:#4be0a8;font-size:18px;display:grid;place-items:center}
.step span{min-width:24px;text-align:center;font:700 13px var(--mono);color:#4be0a8}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;margin-top:24px}

/* visit */
.info{display:grid;gap:22px;margin:28px 0}
.info div{display:flex;gap:16px;align-items:flex-start}
.info .ico{color:var(--gold);width:22px;height:22px;margin-top:3px}
.info b{display:block;font:500 17px var(--sans)}
.info small{display:block;font:400 12px var(--mono);color:var(--muted);letter-spacing:.04em}
.foot{border-top:1px solid var(--line-soft);padding-block:40px 120px;text-align:center;color:var(--dim);font:400 12px/1.8 var(--mono)}
.foot svg.logo{width:64px;height:64px;border-radius:50%;margin-bottom:12px}
.foot a{color:var(--gold);text-decoration:none}

/* cart bar + sheet */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:55;padding:12px var(--gutr) calc(12px + env(safe-area-inset-bottom,0px)) var(--gut);pointer-events:none}
.bar button{pointer-events:auto;display:flex;width:100%;max-width:680px;margin-inline:auto;align-items:center;justify-content:space-between;gap:12px;background:#12a56f;border:0;border-radius:10px;padding:14px 18px;color:#fff;font-weight:600;text-align:left;box-shadow:0 10px 30px #0008}
.bar small{display:block;font-weight:400;opacity:.85;font-size:12px}
.shade{position:fixed;inset:0;background:#000a;z-index:70;display:flex;justify-content:center;align-items:flex-end;backdrop-filter:blur(3px)}
.sheet{width:100%;max-width:560px;max-height:94vh;max-height:94dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:22px var(--gutr) calc(22px + env(safe-area-inset-bottom,0px)) var(--gut)}
.sheet h3{margin:0;font:400 28px var(--serif)}
.sheet .sub2{color:var(--muted);font-size:14px;margin:4px 0 18px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{background:none;border:0;color:var(--muted);padding:4px}
.line{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--bg-2);border:1px solid var(--line-soft);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.line .nm{font-weight:500;font-size:15px}
.line .pr{font:400 12px var(--mono);color:var(--gold)}
label.l{display:block;font-size:14px;margin:18px 0 8px;color:var(--fg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--bg-2);border-radius:8px;padding:12px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.seg button[aria-pressed=true]{background:#d4a2571f;border-color:var(--gold);color:var(--gold-hi)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.fld{width:100%;background:var(--input);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:12px 14px;font:inherit;outline-offset:2px}
textarea.fld{min-height:72px;resize:vertical}
.hint{font-size:13px;color:var(--gold);margin:8px 0 0}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 14px;font-size:15px}
.tot b{font:600 24px var(--mono);font-variant-numeric:tabular-nums}
.wa{width:100%;background:#12a56f;border:0;color:#fff;border-radius:8px;padding:15px;font-weight:600;font-size:16px;display:flex;justify-content:center;gap:10px;align-items:center}
.wa:disabled{opacity:.45;cursor:not-allowed}
.clr{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font-size:14px}
.upi{background:#fff;color:#111;border-radius:12px;padding:16px;text-align:center;margin-top:12px}
.upi canvas{width:200px;height:200px;max-width:100%}
.upi p{margin:6px 0 0;font-size:13px}

/* QR view */
.back{display:inline-flex;gap:10px;align-items:center;color:var(--muted);text-decoration:none;margin:28px 0 22px}
.qrcard{background:#fff;color:#111;border-radius:26px 26px 0 0;text-align:center;padding:34px 20px 28px;border:1px solid var(--line);border-bottom:0}
.qrcard svg.logo{width:88px;height:88px;border-radius:50%}
.qrcard .mono{color:#8a6a35;margin-top:12px}
.qrcard h1{font:400 clamp(38px,8vw,56px)/1.05 var(--serif);margin:10px 0}
.qrcard p{color:#555;margin:0 auto 18px;max-width:420px}
.qrbox{display:inline-block;border:6px solid #111;border-radius:22px;padding:18px;background:#fff;line-height:0}
.qrbox img{width:min(70vw,320px);height:min(70vw,320px);display:block}
.qrcard h2{font:400 32px var(--serif);margin:20px 0 0}
.qrcard small{font:400 14px var(--mono);color:#555;letter-spacing:.05em}
.qrdown{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 26px 26px;padding:30px 20px 34px;display:grid;gap:14px}
.qrdown h2{font:400 clamp(32px,6vw,44px) var(--serif);margin:6px 0 0}
.qrdown p{color:var(--muted);margin:0}
.urlbox{border:1px solid var(--line);border-radius:10px;background:var(--input);padding:14px 16px;color:var(--gold-hi);font:400 22px var(--serif)}

/* Owner view */
.own{padding-block:36px 100px}
.own h1{font:400 clamp(36px,6vw,56px)/1.05 var(--serif);margin:14px 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-top:22px;overflow:hidden}
.panel>header{padding:22px}
.panel h2{margin:0;font:400 34px var(--serif)}
.panel header p{margin:6px 0 18px;color:var(--muted)}
.tools{display:flex;gap:12px;flex-wrap:wrap}
.tools .btn{padding:12px 18px}
.filters{display:flex;gap:14px;flex-wrap:wrap;padding:20px 22px;border-block:1px solid var(--line)}
.filters .search{flex:1 1 260px;margin:0}
.filters select{flex:1 1 200px;background:var(--input);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:14px 16px;font:inherit}
.row{padding:22px;border-bottom:1px solid var(--line);display:grid;gap:14px;justify-items:start;max-width:100%}
.row h3{margin:0;font:500 clamp(22px,3vw,28px) var(--sans);display:flex;gap:12px;align-items:center}
.row .dot{width:12px;height:12px;border-radius:50%;background:var(--veg);flex:none}
.row .dot.nv{background:var(--nonveg)}
.row .ct{color:var(--muted)}
.ck{display:flex;gap:14px;align-items:center;font-size:18px;cursor:pointer}
.ck input{appearance:none;width:30px;height:30px;border-radius:5px;background:var(--input);border:1px solid var(--line);display:grid;place-items:center;margin:0;cursor:pointer}
.ck input:checked{background:#17b97e;border-color:#17b97e}
.ck input:checked::after{content:"";width:8px;height:15px;border:solid #06241a;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.mostl{width:100%;border:1px solid var(--line);background:none;border-radius:12px;padding:16px;display:flex;justify-content:center;gap:10px;align-items:center;color:var(--muted);font-size:18px}
.mostl[aria-pressed=true]{border-color:var(--gold);color:var(--gold-hi);background:#d4a25714}
.mostl[aria-pressed=true] .ico{fill:currentColor}
.pricebox{display:flex;gap:12px;flex-wrap:wrap}
.pricebox label{display:flex;align-items:center;gap:12px;background:var(--input);border:1px solid var(--line);border-radius:14px;padding:0 18px;min-width:210px}
.pricebox label span{color:var(--gold)}
.pricebox input{background:none;border:0;color:var(--fg);font:500 22px var(--sans);width:100%;padding:14px 0;outline:none;min-width:0;font-variant-numeric:tabular-nums}
.sq{width:58px;height:58px;border-radius:14px;border:1px solid var(--line);background:var(--input);display:grid;place-items:center;color:var(--fg)}
.sq:hover{border-color:var(--gold)}
.trash{background:none;border:0;color:var(--muted);padding:6px}
.trash:hover{color:var(--nonveg)}
.form{display:grid;gap:12px;padding:20px 22px;border-top:1px solid var(--line);background:var(--bg-2)}
.form .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.note{padding:14px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:15px;margin-top:20px}
.note b{color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--gold-ink);padding:10px 18px;border-radius:999px;font-weight:600;z-index:90;font-size:14px}
</style>

const ic = (n, c="") => `<svg class="ico ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const logo = c => `<svg class="logo ${c||""}" viewBox="0 0 100 100" role="img" aria-label="The Golden Sip café logo"><use href="#logo"/></svg>`;
const rs = n => "₹" + Number(n).toLocaleString("en-IN");
const byId = id => state.items.find(i => i.id === id);

/* ---------- cart ---------- */
const keyOf = (id, size) => id + (size ? ":" + size : "");
function priceOf(it, size){ return size === "10" && it.p10 ? it.p10 : it.price; }
function cartLines(){
  return Object.values(cart).map(l => ({...l, it: byId(l.id)})).filter(l => l.it && l.qty > 0);
}
function cartTotal(){ return cartLines().reduce((s,l) => s + priceOf(l.it, l.size) * l.qty, 0); }
function cartCount(){ return cartLines().reduce((s,l) => s + l.qty, 0); }
function bump(id, size, d){
  const k = keyOf(id, size);
  const cur = cart[k] || {id, size, qty:0};
  cur.qty = Math.max(0, cur.qty + d);
  if (cur.qty) cart[k] = cur; else delete cart[k];
  renderMenuLists(); renderBar(); renderCartBadge(); if (ui.cartOpen) renderSheet();
}

/* ---------- menu rendering ---------- */
function itemRow(it){
  const sizes = it.p10 ? ["7","10"] : [""];
  const sizeLabel = s => s ? `${s}″ ${rs(priceOf(it,s))}` : "";
  const acts = sizes.map(s => {
    const l = cart[keyOf(it.id, s)];
    if (!it.ok) return `<button class="add" disabled>SOLD OUT</button>`;
    if (l) return `<span class="step" role="group" aria-label="${esc(it.name)} ${s? s+' inch':''} quantity"><button data-b="${it.id}|${s}|-1" aria-label="Remove one">−</button><span>${l.qty}</span><button data-b="${it.id}|${s}|1" aria-label="Add one">+</button></span>`;
    return `<button class="add" data-b="${it.id}|${s}|1" aria-label="Add ${esc(it.name)} ${s? s+' inch':''}">+ ADD${s ? " " + s + "″" : ""}</button>`;
  }).join("");
  const price = it.p10 ? `<span class="pr">${rs(it.price)} / ${rs(it.p10)}</span>` : `<span class="pr">${rs(it.price)}</span>`;
  return `<div class="it ${it.ok?"":"off"}"><span class="vd ${it.veg?"":"nv"}" title="${it.veg?"Veg":"Non-veg"}"></span><div class="tx"><div class="nm">${esc(it.name)}</div><div class="sb">${esc(it.note || (it.cat + ", better vibes"))}</div></div>${price}<div class="acts">${acts}</div></div>`;
}
function matches(it){
  const q = ui.q.trim().toLowerCase();
  if (ui.diet === "veg" && !it.veg) return false;
  if (ui.diet === "non" && it.veg) return false;
  if (ui.cat !== "All" && it.cat !== ui.cat) return false;
  if (q && !(it.name + " " + it.cat + " " + it.note).toLowerCase().includes(q)) return false;
  return true;
}
function renderLoved(){
  const el = $("#loved"); if (!el) return;
  const l = state.items.filter(i => i.loved && i.ok);
  const mk = (veg, title) => {
    const xs = l.filter(i => i.veg === veg);
    if (!xs.length) return "";
    return `<div class="lv"><h3><span class="vd ${veg?"":"nv"}"></span>${title}<small>${xs.length} favourites</small></h3><div style="display:grid;gap:10px">${xs.map(itemRow).join("")}</div></div>`;
  };
  el.innerHTML = mk(true, "Veg Most Loved") + mk(false, "Non-veg Most Loved");
  el.hidden = !el.innerHTML;
}
function renderMenuLists(){
  const box = $("#menulist"); if (!box) return;
  const cats = state.cats.filter(c => state.items.some(i => i.cat === c));
  const shown = state.items.filter(matches);
  $("#count").textContent = `Full menu · ${state.items.length} choices`;
  $("#chips").innerHTML = ["All", ...cats].map(c => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${ui.cat===c}">${esc(c)}</button>`).join("");
  $("#diet").innerHTML = [["all","All"],["veg","Veg only"],["non","Non-veg"]].map(([k,t]) => `<button class="chip" data-diet="${k}" aria-pressed="${ui.diet===k}">${t}</button>`).join("");
  if (!shown.length){ box.innerHTML = `<div class="empty">No dishes match that search. Try another word or clear the filters.</div>`; renderLoved(); return; }
  box.innerHTML = cats.map(c => {
    const xs = shown.filter(i => i.cat === c); if (!xs.length) return "";
    const subs = [["veg", xs.filter(i=>i.veg)], ["non", xs.filter(i=>!i.veg)]].filter(s => s[1].length);
    const both = subs.length > 1;
    return `<section class="cat" aria-label="${esc(c)}"><h3>${esc(c)}<small>${xs.length} dishes</small></h3>${subs.map(([k,list]) => `${both || k==="non" ? `<div class="sub"><span class="vd ${k==="veg"?"":"nv"}"></span>${k==="veg"?"Veg":"Non-veg"}</div>`:`<div class="sub"><span class="vd"></span>Veg</div>`}<div class="list">${list.map(itemRow).join("")}</div>`).join("")}</section>`;
  }).join("");
  renderLoved();
}
function renderBar(){
  const b = $("#bar"); if (!b) return;
  const n = cartCount();
  if (!n || ui.cartOpen || route() !== "home"){ b.innerHTML = ""; return; }
  const t = cartTotal();
  b.innerHTML = `<button id="openCart"><span>${ic("bag")} ${n} item${n>1?"s":""}<small>${t >= MIN_DELIVERY ? "Delivery available" : "Delivery from " + rs(MIN_DELIVERY)}</small></span><span>${rs(t)} ${ic("arrow")}</span></button>`;
}
function renderCartBadge(){
  const n = cartCount();
  document.querySelectorAll(".cartbtn b").forEach(e => e.remove());
  if (n) document.querySelectorAll(".cartbtn").forEach(c => c.insertAdjacentHTML("beforeend", `<b>${n}</b>`));
}

/* QR */
function makeQR(canvas, text, withLogo){
  const q = qrcode(0, "H"); q.addData(text); q.make();
  const n = q.getModuleCount(), px = 12, pad = 0, size = n * px;
  canvas.width = canvas.height = size;
  const g = canvas.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0,0,size,size);
  g.fillStyle = "#111";
  for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (q.isDark(r,c)) g.fillRect(c*px+pad, r*px+pad, px, px);
  if (withLogo){
    const s = size * 0.2, x = (size - s)/2;
    g.fillStyle = "#fff"; g.fillRect(x-8, x-8, s+16, s+16);
    g.fillStyle = "#0d0a08"; g.beginPath(); g.arc(size/2, size/2, s/2, 0, 7); g.fill();
    g.fillStyle = "#f0c274"; g.textAlign = "center"; g.font = `italic ${s*.5}px Georgia,serif`; g.fillText("GS", size/2, size/2 + s*.08);
    g.fillStyle = "#f7f1e6"; g.font = `700 ${s*.1}px sans-serif`; g.fillText("THE GOLDEN SIP", size/2, size/2 + s*.26);
  }
}

  <div class="hint" id="lerr" role="alert" style="color:var(--nonveg)" hidden>That email, phone or password is not right. Check it and try again.</div>
  <button class="btn gold" type="submit" style="width:100%;justify-content:center;margin-top:24px;padding:16px">Open owner dashboard</button></form></main>`;
  renderCartBadge();
}

/* Owner */
function persist(msg){
  clearTimeout(writeTimer);
  writeTimer = setTimeout(async () => {
    if (!dbDoc || !canEdit) return toast("Sign in as the owner to save changes");
    try { await dbDoc.set({ items: state.items, cats: state.cats, upi: state.upi, phone: state.phone, updated: Date.now() }); toast(msg || "Saved. Live on the public menu"); }
    catch(e){ toast("Could not save. Check your connection and try again"); }
  }, 250);
}
function renderOwner(){
  if (!unlocked){ renderLogin(); return; }
  const o = ui.own;
  const rows = state.items.filter(i => (o.cat === "all" || i.cat === o.cat) && (!o.q || (i.name+i.cat).toLowerCase().includes(o.q.toLowerCase())));
  const f = o.form;
  $("#app").innerHTML = header("owner") + `<main class="wrap own" style="max-width:820px">
  <div class="mono">Owner dashboard</div><h1>Run the menu, <em style="color:var(--gold-hi)">live.</em></h1>
  ${canEdit ? "" : `<div class="note"><b>View only.</b> Changes save only when this page is opened from the Claude account that owns it.</div>`}
  ${canEdit && !state.live ? `<div class="note"><b>Menu not saved online yet.</b> Tap below to publish the starter menu so edits go live for guests. <div style="margin-top:12px"><button class="btn gold" id="seed">Publish starter menu</button></div></div>` : ""}
  <div class="panel"><header><h2>Live menu items</h2><p>Price and availability changes appear on the public menu immediately.</p>
    <div class="tools"><button class="btn" id="addCat">${ic("plus")} Category</button><button class="btn gold" id="addDish">${ic("plus")} Add dish</button><button class="btn" id="lockOut">${ic("x")} Sign out</button></div></header>
    ${f === "cat" ? `<form class="form" id="catForm"><label class="l" for="cn" style="margin:0">New category name</label><input class="fld" id="cn" required maxlength="40" placeholder="e.g. Breakfast"><div class="tools"><button class="btn gold" type="submit">Add category</button><button class="btn" type="button" id="cancelForm">Cancel</button></div></form>` : ""}
    ${f === "dish" ? `<form class="form" id="dishForm"><div class="grid"><div><label class="l" for="dn" style="margin:0 0 6px">Dish name</label><input class="fld" id="dn" required maxlength="60"></div><div><label class="l" for="dp" style="margin:0 0 6px">Price (₹)</label><input class="fld" id="dp" type="number" min="0" required inputmode="numeric"></div></div>
      <div class="grid"><div><label class="l" for="dc" style="margin:0 0 6px">Category</label><select class="fld" id="dc">${state.cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div><label class="l" for="dv" style="margin:0 0 6px">Type</label><select class="fld" id="dv"><option value="1">Veg</option><option value="0">Non-veg</option></select></div></div>
      <div><label class="l" for="dnote" style="margin:0 0 6px">Short description (optional)</label><input class="fld" id="dnote" maxlength="90"></div>
      <div class="tools"><button class="btn gold" type="submit">Add dish</button><button class="btn" type="button" id="cancelForm">Cancel</button></div></form>` : ""}
    <div class="filters"><label class="search">${ic("search")}<input id="oq" type="search" placeholder="Search dishes" aria-label="Search dishes"></label>
      <select id="oc" aria-label="Category filter"><option value="all">All categories</option>${state.cats.map(c=>`<option ${o.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
    <div id="orows">${rows.length ? rows.slice(0,60).map(ownRow).join("") : `<div class="empty" style="border:0">No dishes found.</div>`}${rows.length>60?`<div class="empty" style="border:0">Showing the first 60 of ${rows.length}. Search or pick a category to narrow it down.</div>`:""}</div>
  </div>
  <div class="panel"><header><h2>Contact phone</h2><p>Shown on the website, used for the Call button and as the WhatsApp number that receives orders.</p>
    <div class="pricebox"><label><span>${ic("phone")}</span><input id="phone" type="tel" placeholder="+91 7559492970" value="${esc(state.phone)}" aria-label="Contact phone number" autocomplete="off"></label><button class="sq" id="savePhone" aria-label="Save phone number">${ic("save")}</button></div></header></div>
  <div class="panel"><header><h2>Online payment</h2><p>Add your UPI ID so guests who choose Online see a payment QR with the exact amount.</p>
    <div class="pricebox"><label><span>@</span><input id="upi" placeholder="yourname@upi" value="${esc(state.upi)}" aria-label="UPI ID"></label><button class="sq" id="saveUpi" aria-label="Save UPI ID">${ic("save")}</button></div></header></div>
  </main>`;
  $("#oq").value = o.q;
  renderCartBadge();
}
function ownRow(it){
  return `<div class="row" data-id="${it.id}"><h3><span class="dot ${it.veg?"":"nv"}"></span>${esc(it.name)}</h3><div class="ct">${esc(it.cat)}${it.p10?" · 7″ price shown, 10″ "+rs(it.p10):""}</div>
  <label class="ck"><input type="checkbox" data-ok ${it.ok?"checked":""}> Available</label>
  <button class="mostl" data-loved aria-pressed="${!!it.loved}">${ic("star")} Most Loved</button>
  <div class="pricebox"><label><span>₹</span><input data-price type="number" min="0" inputmode="numeric" value="${it.price}" aria-label="Price for ${esc(it.name)}"></label>${it.p10?`<label><span>10″ ₹</span><input data-price10 type="number" min="0" inputmode="numeric" value="${it.p10}" aria-label="10 inch price"></label>`:""}<button class="sq" data-save aria-label="Save price">${ic("save")}</button></div>
  <button class="trash" data-del aria-label="Delete ${esc(it.name)}">${ic("trash")}</button></div>`;
}

/* ---------- cart sheet ---------- */
function renderSheet(){
  const portal = $("#portal");
  if (!ui.cartOpen){ portal.innerHTML = ""; return; }
  const lines = cartLines(), total = cartTotal();
  const deliv = total >= MIN_DELIVERY;
  if (ui.order === "Delivery" && !deliv) ui.order = "Dine-in";
  const payOpts = ui.order === "Dine-in" ? ["Pay at counter"] : ["Online"];
  ui.pay = payOpts[0];
  const needAddr = ui.order === "Delivery";
  const ready = lines.length && (!needAddr || (ui.name.trim() && ui.phone.trim().length >= 8 && ui.addr.trim()));
  portal.innerHTML = `<div class="shade" id="shade"><div class="sheet" role="dialog" aria-modal="true" aria-label="Your golden order">
  <div class="sh-top"><div><h3>Your golden order</h3><div class="sub2">Review your picks and send them directly to the café.</div></div><button class="x" id="closeCart" aria-label="Close">${ic("x")}</button></div>
  ${lines.length ? lines.map(l => `<div class="line"><div><div class="nm">${esc(l.it.name)}${l.size?` · ${l.size}″`:""}</div><div class="pr">${rs(priceOf(l.it,l.size))}</div></div><span class="step"><button data-b="${l.id}|${l.size}|-1" aria-label="Remove one">−</button><span>${l.qty}</span><button data-b="${l.id}|${l.size}|1" aria-label="Add one">+</button></span></div>`).join("") : `<div class="empty">Your order is empty. Add something from the menu.</div>`}
  <label class="l">Order type</label>
  <div class="seg">${[["Dine-in","store"],["Takeaway","walk"],["Delivery","bike"]].map(([t,i]) => `<button data-ot="${t}" aria-pressed="${ui.order===t}" ${t==="Delivery"&&!deliv?"disabled":""}>${ic(i)}${t}</button>`).join("")}</div>
  ${deliv ? `<div class="hint">Delivery available for this ${rs(MIN_DELIVERY)}+ order.</div>` : `<div class="hint">Add ${rs(MIN_DELIVERY-total)} more to unlock delivery.</div>`}
  ${ui.order === "Dine-in" ? `<label class="l" for="tbl">Table number (optional)</label><input class="fld" id="tbl" placeholder="e.g. 4" value="${esc(ui.table)}" inputmode="numeric">` : ""}
  ${needAddr ? `<label class="l" for="cname">Customer name</label><input class="fld" id="cname" placeholder="Your full name" value="${esc(ui.name)}" autocomplete="name"><label class="l" for="cph">Phone number</label><input class="fld" id="cph" placeholder="Your contact number" value="${esc(ui.phone)}" inputmode="tel" autocomplete="tel"><label class="l" for="cad">Full delivery address</label><textarea class="fld" id="cad" placeholder="Building, street, landmark and PIN">${esc(ui.addr)}</textarea>` : ""}
  <label class="l">Payment method</label>
  <div class="seg">${payOpts.map(p => `<button data-pay="${p}" aria-pressed="${ui.pay===p}">${ic("card")}${p}</button>`).join("")}</div>
  ${ui.pay === "Online" ? (state.upi ? `<div class="upi"><div style="font-weight:600;margin-bottom:8px">Scan to pay ${rs(total)} with any UPI app</div><canvas id="upiqr"></canvas><p>${esc(state.upi)}</p><p>Your order is confirmed by the café after payment is checked.</p></div>` : `<div class="hint" style="color:var(--muted)">Online payment details are shared by the café on WhatsApp after you send the order.</div>`) : ""}
  <label class="l" for="note">Special instructions</label><textarea class="fld" id="note" placeholder="Less spicy, no onion...">${esc(ui.note)}</textarea>
  <div class="tot"><span>Total</span><b>${rs(total)}</b></div>
  <button class="wa" id="sendWa" ${ready?"":"disabled"}>${ic("wa")} Confirm on WhatsApp</button>
  <button class="clr" id="clear">Clear cart</button></div></div>`;
  const qc = $("#upiqr");
  if (qc && state.upi) makeQR(qc, `upi://pay?pa=${encodeURIComponent(state.upi)}&pn=${encodeURIComponent("The Golden Sip")}&am=${total}&cu=INR`, false);
}
function sendWhatsApp(){
  const lines = cartLines();
  let t = "Hi The Golden Sip! I'd like to place an order.\n\n";
  lines.forEach(l => t += `• ${l.it.name}${l.size?` (${l.size} inch)`:""} x${l.qty} — ${rs(priceOf(l.it,l.size)*l.qty)}\n`);
  t += `\nTotal: ${rs(cartTotal())}\nOrder type: ${ui.order}\n`;
  if (ui.order === "Dine-in" && ui.table.trim()) t += `Table: ${ui.table.trim()}\n`;
  if (ui.order === "Delivery") t += `Name: ${ui.name.trim()}\nPhone: ${ui.phone.trim()}\nAddress: ${ui.addr.trim()}\n`;
  t += `Payment: ${ui.pay}`;
  if (ui.note.trim()) t += `\nNotes: ${ui.note.trim()}`;
  window.open("https://wa.me/" + waNum() + "?text=" + encodeURIComponent(t), "_blank", "noopener");
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  document.querySelectorAll(".toast").forEach(e => e.remove());
  const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role","status"); d.textContent = msg; document.body.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2600);
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target;
  const b = t.closest("[data-b]");
  if (b){ const [id,size,d] = b.dataset.b.split("|"); bump(id, size, +d); return; }
  if (t.closest("#cartBtn") || t.closest("#openCart")){ ui.cartOpen = true; renderSheet(); renderBar(); return; }
  if (t.closest("#closeCart") || t.id === "shade"){ ui.cartOpen = false; renderSheet(); renderBar(); return; }
  const ch = t.closest("[data-cat]"); if (ch){ ui.cat = ch.dataset.cat; renderMenuLists(); return; }
  const dt = t.closest("[data-diet]"); if (dt){ ui.diet = dt.dataset.diet; renderMenuLists(); return; }
  const ot = t.closest("[data-ot]"); if (ot){ ui.order = ot.dataset.ot; renderSheet(); return; }
  const py = t.closest("[data-pay]"); if (py){ ui.pay = py.dataset.pay; renderSheet(); return; }
  if (t.closest("#clear")){ for (const k in cart) delete cart[k]; ui.cartOpen = false; renderSheet(); renderMenuLists(); renderBar(); renderCartBadge(); return; }
  if (t.closest("#sendWa")){ sendWhatsApp(); return; }
  if (t.closest("#dlqr")){
    try { const blob = await (await fetch($("#qrc").src)).blob(); const d = await claude.use("downloads"); if (!d) throw 0; await d.save({filename:"the-golden-sip-instagram-qr.jpg", data:blob}); }
    catch(_){ toast("Long-press the QR code to save it"); }
    return;
  }
  if (t.closest("#cpqr")){ try { await navigator.clipboard.writeText(menuUrl()); toast("Menu link copied"); } catch(_){ toast(menuUrl()); } return; }
  /* owner */
  if (route() === "owner"){
    if (t.closest("#lockOut")){ unlocked = false; try { sessionStorage.removeItem("gs-owner"); } catch(_){} renderOwner(); return; }
    if (t.closest("#addCat")){ ui.own.form = "cat"; renderOwner(); $("#cn")?.focus(); return; }
    if (t.closest("#addDish")){ ui.own.form = "dish"; renderOwner(); $("#dn")?.focus(); return; }
    if (t.closest("#cancelForm")){ ui.own.form = null; renderOwner(); return; }
    if (t.closest("#seed")){ persist("Starter menu published"); state.live = true; renderOwner(); return; }
    if (t.closest("#savePhone")){
      const v = $("#phone").value.trim(), d = v.replace(/\D/g, "");
      if (d.length < 10 || d.length > 13 || !/^[+\d\s()-]+$/.test(v)){ toast("Enter a valid phone number, like +91 7559492970"); return; }
      if (!canEdit){ toast("Sign in as the owner to make changes"); return; }
      state.phone = v; persist("Phone number updated everywhere"); return;
    }
    if (t.closest("#saveUpi")){ state.upi = $("#upi").value.trim(); persist("UPI ID saved"); return; }
    const row = t.closest(".row");
    if (row){
      const it = byId(row.dataset.id); if (!it) return;
      if (!canEdit){ toast("Sign in as the owner to make changes"); return; }
      if (t.closest("[data-loved]")){ it.loved = !it.loved; persist(); renderOwner(); return; }
      if (t.closest("[data-save]")){
        const p = +row.querySelector("[data-price]").value, p10 = row.querySelector("[data-price10]");
        if (!(p >= 0) || row.querySelector("[data-price]").value === ""){ toast("Enter a valid price"); return; }
        it.price = p; if (p10) it.p10 = +p10.value || it.p10; persist(`${it.name} is now ${rs(p)}`); return;
      }
      if (t.closest("[data-del]")){
        if (row.dataset.arm !== "1"){ row.dataset.arm = "1"; row.querySelector("[data-del]").innerHTML = `${ic("trash")} <span style="font-size:14px">Tap again to delete</span>`; setTimeout(()=>{ row.dataset.arm = ""; }, 3000); return; }
        state.items = state.items.filter(x => x.id !== it.id); for (const k of Object.keys(cart)) if (cart[k].id === it.id) delete cart[k];
        persist(`${it.name} deleted`); renderOwner(); return;
      }
    }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "oc"){ ui.own.cat = t.value; renderOwner(); return; }
  const row = t.closest(".row");
  if (row && t.matches("[data-ok]")){
    if (!canEdit){ t.checked = !t.checked; toast("Sign in as the owner to make changes"); return; }
    const it = byId(row.dataset.id); it.ok = t.checked; persist(`${it.name} is ${it.ok ? "available" : "sold out"}`);
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q"){ ui.q = t.value; renderMenuLists(); }
  else if (t.id === "oq"){ ui.own.q = t.value; const rows = state.items.filter(i => (ui.own.cat==="all"||i.cat===ui.own.cat) && (!ui.own.q || (i.name+i.cat).toLowerCase().includes(ui.own.q.toLowerCase()))); $("#orows").innerHTML = rows.length ? rows.slice(0,60).map(ownRow).join("") : `<div class="empty" style="border:0">No dishes found.</div>`; }
  else if (t.id === "tbl") ui.table = t.value;
  else if (t.id === "cname") { ui.name = t.value; syncReady(); }
  else if (t.id === "cph") { ui.phone = t.value; syncReady(); }
  else if (t.id === "cad") { ui.addr = t.value; syncReady(); }
  else if (t.id === "note") ui.note = t.value;
});
function syncReady(){
  const b = $("#sendWa"); if (!b) return;
  b.disabled = !(cartLines().length && (ui.order !== "Delivery" || (ui.name.trim() && ui.phone.trim().length >= 8 && ui.addr.trim())));
}
document.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "loginForm"){
    let ok = false;
    try { ok = await credsOk($("#lid").value, $("#lpw").value); } catch(_){}
    if (ok){ unlocked = true; try { sessionStorage.setItem("gs-owner","1"); } catch(_){} renderOwner(); }
    else { $("#lerr").hidden = false; $("#lpw").value = ""; $("#lpw").focus(); }
    return;
  }
  if (e.target.id === "catForm"){
    const n = $("#cn").value.trim(); if (!n) return;
    if (state.cats.some(c => c.toLowerCase() === n.toLowerCase())){ toast("That category already exists"); return; }
    state.cats.push(n); ui.own.form = null; persist(`${n} category added`); renderOwner();
  }
  if (e.target.id === "dishForm"){
    const name = $("#dn").value.trim(), price = +$("#dp").value; if (!name || !(price >= 0)) return;
    const id = "n" + Date.now().toString(36);
    state.items.unshift({id, name, cat:$("#dc").value, veg:$("#dv").value === "1", price, ok:true, loved:false, note:$("#dnote").value.trim()});
    ui.own.form = null; ui.own.cat = "all"; ui.own.q = ""; persist(`${name} added to the menu`); renderOwner();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && ui.cartOpen){ ui.cartOpen = false; renderSheet(); renderBar(); } });

/* ---------- routing ---------- */
function render(){
  const r = route();
  if (r === "instagram") renderInsta(); else if (r === "owner") renderOwner(); else renderHome();
  renderBar();
  if (r === "home"){
    const id = location.hash.slice(1);
    const el = id && document.getElementById(id);
    if (el) requestAnimationFrame(() => el.scrollIntoView()); else window.scrollTo(0,0);
  } else window.scrollTo(0,0);
}
let lastRoute = null;
window.addEventListener("hashchange", () => {
  const r = route();
  if (r === "home" && lastRoute === "home"){ const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); else window.scrollTo(0,0); return; }
  lastRoute = r; render();
});
lastRoute = route(); render();

/* ---------- live data ---------- */
(async () => {
  try {
    const u = await claude.use("user"); canEdit = !!(await u?.canEdit());
  } catch(_){}
  try {
    const db = await claude.use("db"); if (!db) return;
    dbDoc = db.doc("menu/live");
    dbDoc.onSnapshot(snap => {
      if (snap.exists){
        const d = snap.data() || {};
        if (Array.isArray(d.items) && d.items.length){ state.items = d.items; state.cats = Array.isArray(d.cats) ? d.cats : state.cats; state.upi = d.upi || ""; if (typeof d.phone === "string" && d.phone.trim()) state.phone = d.phone; state.live = true; }
        if (!snap.metadata.hasPendingWrites){
          const a = document.activeElement;
          if (route() === "home"){ renderMenuLists(); renderBar(); if (ui.cartOpen) renderSheet(); }
          else if (route() === "owner" && unlocked && !(a && a.closest && a.closest(".row, .form, .filters, .pricebox"))) renderOwner();
        }
      }
    }, () => {});
  } catch(_){}
})();
</script>

</body></html>
